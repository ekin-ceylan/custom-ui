            }, 1500);

            import { LitElement, html } from 'lit';
            import Checkbox from '/src/components/select/check-box.js';

            if (!customElements.get('check-box')) {
                customElements.define('check-box', Checkbox);
            }
            export class LitCheckboxHost extends LitElement {
                static properties = {
                    required: { type: Boolean },
                    checked: { type: Boolean },
                    description: { type: String },
                };

                constructor() {
                    super();
                    this.required = true;
                    this.checked = false;
                    this.description = 'Okudum, onaylıyorum';

                    setTimeout(() => {
                        this.description = 'Onaylandı';
                    }, 2000);
                }
                createRenderRoot() {
                    return this; // Shadow DOM'u kapat
                }

                render() {
                    return html`
                        <check-box label="Kvkk Onayı" ?required=${this.required} ?checked=${this.checked}>
                            <span>${this.description}</span>
                        </check-box>
                    `;
                }
            }

            customElements.define('lit-checkbox-host', LitCheckboxHost);
        </script>
